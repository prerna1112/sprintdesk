<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8fafc" />
    <meta
      name="description"
      content="SprintDesk is an accessible sprint planning workspace with a live dashboard, Kanban board, analytics, and notifications."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>SprintDesk</title>
    <script>
      (() => {
        try {
          const raw = localStorage.getItem('sprintdesk.theme.v1');
          const stored = raw ? JSON.parse(raw)?.state?.preference : 'system';
          const preference = ['light', 'dark', 'system'].includes(stored)
            ? stored
            : 'system';
          const dark =
            preference === 'dark' ||
            (preference === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute('content', dark ? '#14171a' : '#f8fafc');
        } catch {
          const dark = window.matchMedia(
            '(prefers-color-scheme: dark)',
          ).matches;
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute('content', dark ? '#14171a' : '#f8fafc');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
